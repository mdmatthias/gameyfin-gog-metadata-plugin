name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build

      - name: Check plugin version matches tag
        run: |
          VERSION=$(sed -n 's/^Plugin-Version: *//p' src/main/resources/MANIFEST.MF | tr -d '\r')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Plugin-Version ($VERSION) in MANIFEST.MF does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Compute SHA-512 checksums
        working-directory: build/libs
        run: for jar in *.jar; do sha512sum "$jar" | cut -d' ' -f1 > "${jar%.jar}.sha512"; done

      # Existing releases are merged into the generated marketplace manifests
      - name: Checkout Gameyfin plugin marketplace
        uses: actions/checkout@v4
        with:
          repository: gameyfin/plugin-marketplace
          path: plugin-marketplace

      - name: Generate marketplace manifests
        run: |
          python3 scripts/marketplace_manifests.py --version "$VERSION" --jars build/libs \
            --existing plugin-marketplace/plugins --out plugin-marketplace/plugins
          python3 plugin-marketplace/scripts/validate.py --repo plugin-marketplace --offline \
            plugin-marketplace/plugins/io.github.mdmatthias.gameyfin.plugins.gog*.json
          mkdir -p build/marketplace
          cp plugin-marketplace/plugins/io.github.mdmatthias.gameyfin.plugins.gog*.json build/marketplace/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/libs/*.jar
            build/libs/*.sha512
            build/marketplace/*.json
          generate_release_notes: true

      # Downloads the published JARs and checks them exactly like the marketplace CI does
      - name: Validate published release against marketplace rules
        run: |
          python3 plugin-marketplace/scripts/validate.py --repo plugin-marketplace \
            plugin-marketplace/plugins/io.github.mdmatthias.gameyfin.plugins.gog*.json
